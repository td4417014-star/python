[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubt"
version = "1.0.0"
description = "Universal MT5 EA backtester: MQL5 emulation, MT5 data taker, optimisation, parameter sensitivity and survival analysis"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "pyyaml>=6"]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
mt5 = ["MetaTrader5>=5.0.45"]
test = ["pytest>=7"]

[project.scripts]
ubt = "ubt.cli:main"

[tool.setuptools.packages.find]
include = ["ubt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
